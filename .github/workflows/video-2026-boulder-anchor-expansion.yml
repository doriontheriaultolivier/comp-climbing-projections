name: 2026 Boulder anchor expansion

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Call Gemini Flash-Lite after each mandatory dry run
        required: true
        default: false
        type: boolean
      max_windows_per_event:
        required: true
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: boulder-anchor-expansion-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  discover-event:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        event_id: [1478, 1524]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate bounded expansion source
        env:
          MAX_WINDOWS: ${{ inputs.max_windows_per_event }}
        run: |
          if ! [[ "$MAX_WINDOWS" =~ ^[0-9]+$ ]] || [ "$MAX_WINDOWS" -lt 1 ] || [ "$MAX_WINDOWS" -gt 30 ]; then exit 1; fi
          python -m pip install -r requirements.txt
          python -m pip install "google-genai==1.75.0"
          python -m unittest tests.test_video_boulder_anchor_discovery tests.test_boulder_anchor_expansion_v2 -v
          python -m py_compile video_boulder_anchor_discovery.py scripts/run_boulder_anchor_discovery.py scripts/plan_boulder_anchor_expansion_v2.py
      - name: Mandatory dry run
        env:
          MAX_WINDOWS: ${{ inputs.max_windows_per_event }}
        run: |
          python scripts/run_boulder_anchor_discovery.py --pass discovery --target-event-ids 1478,1524 --event-id ${{ matrix.event_id }} --model gemini-3.1-flash-lite --fps 0.25 --max-windows "$MAX_WINDOWS" --max-validation-retries 1 --max-transient-retries 2 --request-timeout-ms 900000 --output-dir artifacts/boulder-anchor-expansion-v2/event-${{ matrix.event_id }}
      - name: Discover bounded expansion anchors
        if: inputs.execute
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_WINDOWS: ${{ inputs.max_windows_per_event }}
        run: |
          python scripts/run_boulder_anchor_discovery.py --pass discovery --target-event-ids 1478,1524 --event-id ${{ matrix.event_id }} --model gemini-3.1-flash-lite --fps 0.25 --max-windows "$MAX_WINDOWS" --max-validation-retries 1 --max-transient-retries 2 --request-timeout-ms 900000 --continue-on-window-failure --execute --output-dir artifacts/boulder-anchor-expansion-v2/event-${{ matrix.event_id }}
      - name: Validate executed checkpoint
        if: inputs.execute
        run: python scripts/validate_boulder_anchor_discovery.py artifacts/boulder-anchor-expansion-v2/event-${{ matrix.event_id }}
      - name: Upload event artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        with:
          name: boulder-anchor-expansion-${{ matrix.event_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/boulder-anchor-expansion-v2/event-${{ matrix.event_id }}/
          if-no-files-found: error
          retention-days: 90
