name: Release candidate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/deployment-acceptance
      - codex/video-anchor-cloud-source

permissions:
  contents: read

jobs:
  private-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install -r requirements.txt pytest pytest-subtests
      - name: Compile release entry points
        run: >-
          python -m py_compile
          streamlit_app.py
          comp_climbing_app.py
          style_tagging_app.py
          video_boulder_anchor_discovery.py
          video_boulder_anchor_gemini_compat.py
          video_boulder_anchor_verification_merge.py
          video_boulder_segmentation.py
          video_boulder_wall_frame_plan.py
      - name: Run release acceptance tests
        # Run every tracked release test. An explicit filename list drifted
        # behind merged safeguards for identity status, calibration spectrum,
        # current-model status and the physical coaching slice.
        run: python -m pytest -q
