name: 2026 Boulder anchor discovery

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Call Gemini Flash-Lite after the mandatory dry run
        required: true
        default: false
        type: boolean
      max_windows_per_event:
        description: Pending discovery windows processed per event (1-30)
        required: true
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: boulder-anchor-discovery-v4-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  discover-event:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        event_id: [1479, 1480, 1482]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Check bounded event scope
        env:
          MAX_WINDOWS: ${{ inputs.max_windows_per_event }}
        run: |
          if ! [[ "$MAX_WINDOWS" =~ ^[0-9]+$ ]] || [ "$MAX_WINDOWS" -lt 1 ] || [ "$MAX_WINDOWS" -gt 30 ]; then
            echo "max_windows_per_event must be between 1 and 30" >&2
            exit 1
          fi
      - name: Install direct-review runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "google-genai==1.75.0"
      - name: Restore isolated event checkpoint
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/boulder-anchor-discovery-v4/event-${{ matrix.event_id }}
          key: boulder-anchor-discovery-v4-${{ github.ref_name }}-event${{ matrix.event_id }}-flash-lite-fps0.25-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            boulder-anchor-discovery-v4-${{ github.ref_name }}-event${{ matrix.event_id }}-flash-lite-fps0.25-
      - name: Validate anchor-discovery code
        run: |
          python -m unittest \
            tests.test_video_boulder_anchor_discovery \
            tests.test_video_boulder_anchor_gemini_compat \
            -v
          python -m py_compile video_boulder_anchor_discovery.py video_boulder_anchor_gemini_compat.py scripts/run_boulder_anchor_discovery.py scripts/validate_boulder_anchor_discovery.py
      - name: Mandatory event-scoped dry run
        env:
          MAX_WINDOWS: ${{ inputs.max_windows_per_event }}
        run: |
          python scripts/run_boulder_anchor_discovery.py \
            --pass discovery \
            --event-id ${{ matrix.event_id }} \
            --model gemini-3.1-flash-lite \
            --fps 0.25 \
            --max-windows "$MAX_WINDOWS" \
            --max-validation-retries 1 \
            --max-transient-retries 2 \
            --request-timeout-ms 900000 \
            --output-dir artifacts/boulder-anchor-discovery-v4/event-${{ matrix.event_id }}
      - name: Discover bounded event anchors
        if: inputs.execute
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_WINDOWS: ${{ inputs.max_windows_per_event }}
        run: |
          python scripts/run_boulder_anchor_discovery.py \
            --pass discovery \
            --event-id ${{ matrix.event_id }} \
            --model gemini-3.1-flash-lite \
            --fps 0.25 \
            --max-windows "$MAX_WINDOWS" \
            --max-validation-retries 1 \
            --max-transient-retries 2 \
            --request-timeout-ms 900000 \
            --continue-on-window-failure \
            --execute \
            --output-dir artifacts/boulder-anchor-discovery-v4/event-${{ matrix.event_id }}
      - name: Validate executed event checkpoint
        if: inputs.execute
        run: |
          python scripts/validate_boulder_anchor_discovery.py \
            artifacts/boulder-anchor-discovery-v4/event-${{ matrix.event_id }}
      - name: Save resumable event checkpoint
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/boulder-anchor-discovery-v4/event-${{ matrix.event_id }}
          key: boulder-anchor-discovery-v4-${{ github.ref_name }}-event${{ matrix.event_id }}-flash-lite-fps0.25-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload immutable event artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boulder-anchor-discovery-event-${{ matrix.event_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/boulder-anchor-discovery-v4/event-${{ matrix.event_id }}/
          if-no-files-found: error
          retention-days: 90
